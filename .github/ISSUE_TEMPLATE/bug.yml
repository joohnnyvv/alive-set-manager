name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: App version, OS, architecture, Live version and MIDI controller if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics or screenshots
      description: Review attachments for personal information before posting.
